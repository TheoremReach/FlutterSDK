name: theoremreach_sdk_example
description: "The theoremreach_sdk package's example, on TheoremReach's test apps."
publish_to: "none"
# The package's version; TestFlight's workflow sets the build number.
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  theoremreach_sdk:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
